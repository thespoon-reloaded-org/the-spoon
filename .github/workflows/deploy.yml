name: Déploiement

# Production : chaque commit sur main. Une seule mise en production à la
# fois ; une nouvelle annule celle qui attend encore.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # identité GitHub → GCP (fédération), aucune clé stockée

env:
  REGISTRE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJET }}/spoon
  SERVICE: spoon-${{ vars.ENVIRONNEMENT }}

jobs:
  production:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.URL_PROD }}
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_FOURNISSEUR }}
          service_account: ${{ vars.GCP_SA_DEPLOIEMENT }}

      - uses: google-github-actions/setup-gcloud@v2

      - run: gcloud auth configure-docker ${{ vars.GCP_REGION }}-docker.pkg.dev --quiet

      - uses: docker/setup-buildx-action@v3

      - name: Image de l'application
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runner
          push: true
          tags: ${{ env.REGISTRE }}/${{ env.SERVICE }}:${{ github.sha }}
          cache-from: type=gha,scope=runner
          cache-to: type=gha,mode=max,scope=runner

      - name: Image des migrations
        uses: docker/build-push-action@v6
        with:
          context: .
          target: migrator
          push: true
          tags: ${{ env.REGISTRE }}/${{ env.SERVICE }}-migrations:${{ github.sha }}
          cache-from: type=gha,scope=migrator
          cache-to: type=gha,mode=max,scope=migrator

      # La base n'a qu'une IP privée : les migrations tournent dans un job
      # Cloud Run branché sur le réseau du projet, avant le nouveau code.
      # Si elles échouent, on s'arrête là et la production garde l'ancienne
      # version.
      - name: Migrations
        run: |
          gcloud run jobs deploy "$SERVICE-migrations" \
            --region=${{ vars.GCP_REGION }} \
            --image="$REGISTRE/$SERVICE-migrations:${{ github.sha }}" \
            --service-account=${{ vars.GCP_SA_SERVICE }} \
            --network=spoon-vpc --subnet=spoon-run --vpc-egress=private-ranges-only \
            --set-secrets="DATABASE_URL=${{ vars.ENVIRONNEMENT }}-database-url:latest" \
            --max-retries=0 --task-timeout=300s \
            --execute-now --wait

      # Qui peut appeler le service (public) se règle à la création de
      # l'environnement, pas ici : le compte de déploiement n'a pas ce droit.
      - name: Mise en production
        run: |
          gcloud run deploy "$SERVICE" \
            --region=${{ vars.GCP_REGION }} \
            --image="$REGISTRE/$SERVICE:${{ github.sha }}" \
            --service-account=${{ vars.GCP_SA_SERVICE }} \
            --network=spoon-vpc --subnet=spoon-run --vpc-egress=private-ranges-only \
            --set-secrets="DATABASE_URL=${{ vars.ENVIRONNEMENT }}-database-url:latest,BETTER_AUTH_SECRET=${{ vars.ENVIRONNEMENT }}-auth-secret:latest" \
            --set-env-vars="BETTER_AUTH_URL=${{ vars.URL_PROD }},PHOTOS_BUCKET=${{ vars.GCP_PROJET }}-photos-${{ vars.ENVIRONNEMENT }}" \
            --min-instances=0 --max-instances=2 \
            --cpu=1 --memory=512Mi --concurrency=40 \
            --labels="environnement=${{ vars.ENVIRONNEMENT }},commit=${{ github.sha }}"

      - name: Vérification
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' --retry 5 --retry-all-errors "${{ vars.URL_PROD }}/")
          echo "Page d'accueil : HTTP $code"
          test "$code" = 200
