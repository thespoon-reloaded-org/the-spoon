name: Déploiement

# Production : chaque commit sur main. Une seule mise en production à la
# fois ; une nouvelle annule celle qui attend encore.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # identité GitHub → GCP (fédération), aucune clé stockée

env:
  REGISTRE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJET }}/spoon
  SERVICE: spoon-${{ vars.ENVIRONNEMENT }}

jobs:
  production:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.URL_PROD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # pour comparer avec le commit en production

      - id: arbre
        run: echo "tag=arbre-$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_FOURNISSEUR }}
          service_account: ${{ vars.GCP_SA_DEPLOIEMENT }}

      - uses: google-github-actions/setup-gcloud@v2
        with:
          skip_install: true # gcloud est déjà sur les machines GitHub

      - run: gcloud auth configure-docker ${{ vars.GCP_REGION }}-docker.pkg.dev --quiet

      # Image déjà construite par la CI de la PR (même contenu) ? On la reprend.
      - id: image
        name: Image déjà construite ?
        run: |
          if gcloud artifacts docker images describe "$REGISTRE/$SERVICE:${{ steps.arbre.outputs.tag }}" >/dev/null 2>&1 \
            && gcloud artifacts docker images describe "$REGISTRE/$SERVICE-migrations:${{ steps.arbre.outputs.tag }}" >/dev/null 2>&1; then
            echo "Images reprises de la PR : ${{ steps.arbre.outputs.tag }}"
            echo "existe=oui" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.image.outputs.existe != 'oui'
        uses: docker/setup-buildx-action@v3

      - name: Image de l'application
        if: steps.image.outputs.existe != 'oui'
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runner
          push: true
          tags: ${{ env.REGISTRE }}/${{ env.SERVICE }}:${{ steps.arbre.outputs.tag }}
          cache-from: type=gha,scope=runner
          cache-to: type=gha,mode=max,scope=runner

      - name: Image des migrations
        if: steps.image.outputs.existe != 'oui'
        uses: docker/build-push-action@v6
        with:
          context: .
          target: migrator
          push: true
          tags: ${{ env.REGISTRE }}/${{ env.SERVICE }}-migrations:${{ steps.arbre.outputs.tag }}
          cache-from: type=gha,scope=migrator
          cache-to: type=gha,mode=max,scope=migrator

      # La base n'a qu'une IP privée : les migrations tournent dans un job
      # Cloud Run branché sur le réseau du projet, avant le nouveau code.
      # Si elles échouent, on s'arrête là et la production garde l'ancienne
      # version.
      # Migrations seulement si prisma/migrations a changé depuis le commit en
      # production (lu sur le service). Commit inconnu : on les lance.
      - id: migrations
        name: Nouvelles migrations ?
        run: |
          en_prod=$(gcloud run services describe "$SERVICE" --region=${{ vars.GCP_REGION }} \
            --format='value(metadata.labels.commit)' 2>/dev/null || true)
          if [ -n "$en_prod" ] && git cat-file -e "$en_prod" 2>/dev/null \
            && git diff --quiet "$en_prod" HEAD -- prisma/migrations; then
            echo "Aucune nouvelle migration depuis $en_prod."
          else
            echo "a_lancer=oui" >> "$GITHUB_OUTPUT"
          fi

      - name: Migrations
        if: steps.migrations.outputs.a_lancer == 'oui'
        run: |
          gcloud run jobs deploy "$SERVICE-migrations" \
            --region=${{ vars.GCP_REGION }} \
            --image="$REGISTRE/$SERVICE-migrations:${{ steps.arbre.outputs.tag }}" \
            --service-account=${{ vars.GCP_SA_SERVICE }} \
            --network=spoon-vpc --subnet=spoon-run --vpc-egress=private-ranges-only \
            --set-secrets="DATABASE_URL=${{ vars.ENVIRONNEMENT }}-database-url:latest" \
            --max-retries=0 --task-timeout=300s \
            --execute-now --wait

      # Qui peut appeler le service (public) se règle à la création de
      # l'environnement, pas ici : le compte de déploiement n'a pas ce droit.
      - name: Mise en production
        run: |
          gcloud run deploy "$SERVICE" \
            --region=${{ vars.GCP_REGION }} \
            --image="$REGISTRE/$SERVICE:${{ steps.arbre.outputs.tag }}" \
            --service-account=${{ vars.GCP_SA_SERVICE }} \
            --network=spoon-vpc --subnet=spoon-run --vpc-egress=private-ranges-only \
            --set-secrets="DATABASE_URL=${{ vars.ENVIRONNEMENT }}-database-url:latest,BETTER_AUTH_SECRET=${{ vars.ENVIRONNEMENT }}-auth-secret:latest" \
            --set-env-vars="BETTER_AUTH_URL=${{ vars.URL_PROD }},PHOTOS_BUCKET=${{ vars.GCP_PROJET }}-photos-${{ vars.ENVIRONNEMENT }}" \
            --min-instances=0 --max-instances=2 \
            --cpu=1 --memory=512Mi --concurrency=40 \
            --labels="environnement=${{ vars.ENVIRONNEMENT }},commit=${{ github.sha }}"

      - name: Vérification
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' --retry 5 --retry-all-errors "${{ vars.URL_PROD }}/")
          echo "Page d'accueil : HTTP $code"
          test "$code" = 200
