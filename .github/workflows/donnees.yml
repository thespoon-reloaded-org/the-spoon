name: Données

# Lancé à la main (onglet Actions → Données → Run workflow) : exécute un
# script du dépôt contre la base de production de cet environnement, depuis
# un job Cloud Run du réseau privé (la base n'a pas d'IP publique).
#
# ⚠ `seed:dev` VIDE les tables avant de les remplir : tout ce qui a été saisi
# en production est perdu.
on:
  workflow_dispatch:
    inputs:
      script:
        description: "Script à lancer contre la base de production"
        type: choice
        options: [seed:dev]
        default: seed:dev
      confirmation:
        description: "Taper le nom de l'environnement pour confirmer"
        required: true

concurrency:
  group: production
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  REGISTRE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJET }}/spoon
  SERVICE: spoon-${{ vars.ENVIRONNEMENT }}

jobs:
  donnees:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Confirmation
        run: |
          if [ "${{ inputs.confirmation }}" != "${{ vars.ENVIRONNEMENT }}" ]; then
            echo "Confirmation incorrecte : tapez « ${{ vars.ENVIRONNEMENT }} »." && exit 1
          fi

      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_FOURNISSEUR }}
          service_account: ${{ vars.GCP_SA_DEPLOIEMENT }}

      - uses: google-github-actions/setup-gcloud@v2

      - run: gcloud auth configure-docker ${{ vars.GCP_REGION }}-docker.pkg.dev --quiet

      - uses: docker/setup-buildx-action@v3

      - name: Image des outils
        uses: docker/build-push-action@v6
        with:
          context: .
          target: outils
          push: true
          tags: ${{ env.REGISTRE }}/${{ env.SERVICE }}-outils:${{ github.sha }}
          cache-from: type=gha,scope=runner
          cache-to: type=gha,mode=max,scope=outils

      - name: Lancer ${{ inputs.script }}
        run: |
          gcloud run jobs deploy "$SERVICE-outils" \
            --region=${{ vars.GCP_REGION }} \
            --image="$REGISTRE/$SERVICE-outils:${{ github.sha }}" \
            --service-account=${{ vars.GCP_SA_SERVICE }} \
            --network=spoon-vpc --subnet=spoon-run --vpc-egress=private-ranges-only \
            --set-secrets="DATABASE_URL=${{ vars.ENVIRONNEMENT }}-database-url:latest" \
            --set-env-vars="BETTER_AUTH_SECRET=inutile-pour-les-scripts,BETTER_AUTH_URL=${{ vars.URL_PROD }}" \
            --command=pnpm --args="run,${{ inputs.script }}" \
            --memory=1Gi --max-retries=0 --task-timeout=600s \
            --execute-now --wait
