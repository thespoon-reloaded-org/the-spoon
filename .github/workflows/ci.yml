name: CI

# Une seule machine pour toutes les vérifications (une seule installation
# des dépendances), et en parallèle l'image Docker de la PR : si la PR est
# fusionnée telle quelle, le déploiement reprend cette image au lieu de la
# reconstruire (voir deploy.yml, « Image »).
on:
  pull_request:

permissions:
  contents: read
  id-token: write

jobs:
  verifications:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: thespoon_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: "postgresql://ci:ci@localhost:5432/thespoon_ci"
      BETTER_AUTH_SECRET: "ci-placeholder-secret-not-used-for-anything-real"
      BETTER_AUTH_URL: "http://localhost:3100"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run lint
      - run: pnpm run db:deploy
      - run: pnpm run build
      - run: pnpm test

  image:
    # Seulement pour une PR du dépôt lui-même (une PR venue d'un fork n'a pas
    # l'identité GCP) et un dépôt relié à un environnement.
    if: github.event.pull_request.head.repo.full_name == github.repository && vars.GCP_PROJET != ''
    runs-on: ubuntu-latest
    env:
      REGISTRE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJET }}/spoon
      SERVICE: spoon-${{ vars.ENVIRONNEMENT }}
    steps:
      - uses: actions/checkout@v4
      # L'image porte l'empreinte du contenu (l'arbre git), pas du commit :
      # le commit de fusion sur main aura le même arbre si main n'a pas bougé.
      - id: arbre
        run: echo "tag=arbre-$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_FOURNISSEUR }}
          service_account: ${{ vars.GCP_SA_DEPLOIEMENT }}
      - uses: google-github-actions/setup-gcloud@v2
        with:
          skip_install: true
      - run: gcloud auth configure-docker ${{ vars.GCP_REGION }}-docker.pkg.dev --quiet
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: runner
          push: true
          tags: ${{ env.REGISTRE }}/${{ env.SERVICE }}:${{ steps.arbre.outputs.tag }}
          cache-from: type=gha,scope=runner
          cache-to: type=gha,mode=max,scope=runner
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: migrator
          push: true
          tags: ${{ env.REGISTRE }}/${{ env.SERVICE }}-migrations:${{ steps.arbre.outputs.tag }}
          cache-from: type=gha,scope=migrator
          cache-to: type=gha,mode=max,scope=migrator
